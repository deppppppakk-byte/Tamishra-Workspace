name: Build Tamishra Clients

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tamishra-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck workspace
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  gateway:
    name: Workspace Gateway
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build gateway runtime
        run: npm run build:gateway

      - name: Smoke-test compiled gateway imports
        run: node --input-type=module -e "await import('./packages/identity/dist/index.js'); await import('./packages/permissions/dist/index.js');"

  web:
    name: Website
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          NODE_ENV: production
        run: npm run build:web

      - name: Upload website bundle
        uses: actions/upload-artifact@v4
        with:
          name: tamishra-workspace-web
          path: apps/web/out
          if-no-files-found: error

  windows:
    name: Windows EXE and MSI
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows desktop app
        run: npm run desktop:build

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: tamishra-workspace-windows
          path: |
            apps/desktop/src-tauri/target/release/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build shared frontend
        env:
          NODE_ENV: production
        run: npm run build:web:native

      - name: Create Android native project
        working-directory: apps/mobile
        run: npx cap add android

      - name: Sync Android project
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tamishra-workspace-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
