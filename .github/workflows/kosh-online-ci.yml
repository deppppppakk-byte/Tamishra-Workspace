name: Kosh Online CI

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "apps/kosh-node-agent/**"
      - "apps/web/src/app/apps/kosh/cloud/**"
      - "packages/identity/**"
      - "packages/permissions/**"
      - "scripts/assert-provider-independence.mjs"
      - "scripts/assert-kosh-systems.mjs"
      - ".env.kosh-node.example"
      - ".env.kosh-online.example"
      - ".env.kosh-node-agent.example"
      - "package.json"
      - ".github/workflows/kosh-online-ci.yml"
  pull_request:
    paths:
      - "apps/gateway/**"
      - "apps/kosh-node-agent/**"
      - "apps/web/src/app/apps/kosh/cloud/**"
      - "packages/identity/**"
      - "packages/permissions/**"
      - "scripts/assert-provider-independence.mjs"
      - "scripts/assert-kosh-systems.mjs"
      - ".env.kosh-node.example"
      - ".env.kosh-online.example"
      - ".env.kosh-node-agent.example"
      - "package.json"
      - ".github/workflows/kosh-online-ci.yml"

permissions:
  contents: read

concurrency:
  group: kosh-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Kosh Cloud controller node relay and UI gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Provider independence
        run: npm run check:provider-independence
      - name: Kosh systems contract
        run: npm run check:kosh-systems
      - name: Gateway typecheck
        run: npm run check:gateway
      - name: Kosh Node Agent typecheck
        run: npm run check:kosh-node-agent
      - name: Kosh Cloud dashboard typecheck
        run: npm run check:web
      - name: Gateway production build
        run: npm run build:gateway
      - name: Kosh Node Agent build
        run: npm run build:kosh-node-agent
