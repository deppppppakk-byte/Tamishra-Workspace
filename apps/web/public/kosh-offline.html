<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Kosh — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;color:#102a43;font:16px system-ui,sans-serif}
    main{max-width:440px;padding:32px;text-align:center}
    h1{margin:0 0 10px;font-size:30px}p{line-height:1.55;color:#52677b}
    button{margin-top:10px;border:0;border-radius:10px;background:#102a43;color:white;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Kosh is offline</h1>
    <p>The app shell is available, but repository and collaboration data requires a connection to the Kosh gateway.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
