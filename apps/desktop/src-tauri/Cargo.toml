[package]
name = "tamishra-workspace"
version = "0.1.0"
description = "Tamishra Workspace desktop application"
authors = ["Tamishra"]
edition = "2021"

[lib]
name = "tamishra_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
